<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Aprovação de Orçamento · Digital Coffee</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter','Segoe UI',sans-serif;background:#0d0d0d;color:#fff;min-height:100vh}
.wrap{max-width:720px;margin:0 auto;padding:32px 16px 64px}
.logo-area{text-align:center;margin-bottom:32px;padding:24px}
.logo-area img{max-height:44px;max-width:200px;object-fit:contain}
.logo-text{font-size:22px;font-weight:900;color:#F5B544;letter-spacing:-0.5px}
.card{background:#141414;border:1px solid rgba(255,255,255,.1);border-radius:16px;padding:28px;margin-bottom:20px}
.badge-num{display:inline-block;background:rgba(245,181,68,.15);border:1px solid rgba(245,181,68,.3);color:#F5B544;font-size:12px;font-weight:700;padding:4px 12px;border-radius:20px;margin-bottom:12px;letter-spacing:.5px}
.orc-title{font-size:22px;font-weight:800;margin-bottom:6px}
.orc-sub{font-size:13px;color:rgba(255,255,255,.5);margin-bottom:20px}
.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:20px}
.info-item label{display:block;font-size:10px;text-transform:uppercase;letter-spacing:.5px;color:rgba(255,255,255,.4);margin-bottom:3px;font-weight:600}
.info-item span{font-size:13px;font-weight:600;color:#fff}
.divider{height:1px;background:rgba(255,255,255,.08);margin:20px 0}
.items-table{width:100%;border-collapse:collapse;font-size:13px}
.items-table th{text-align:left;padding:8px 12px;font-size:10px;text-transform:uppercase;letter-spacing:.5px;color:rgba(255,255,255,.4);border-bottom:1px solid rgba(255,255,255,.08)}
.items-table td{padding:10px 12px;border-bottom:1px solid rgba(255,255,255,.05)}
.items-table td:last-child{text-align:right;font-weight:700;color:#F5B544}
.total-row{display:flex;align-items:center;justify-content:space-between;padding:16px 0;margin-top:8px}
.total-label{font-size:13px;color:rgba(255,255,255,.5)}
.total-value{font-size:24px;font-weight:900;color:#F5B544}
.obs-box{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:10px;padding:14px 16px;font-size:12px;color:rgba(255,255,255,.6);line-height:1.6}
.sign-card{background:#141414;border:2px solid rgba(245,181,68,.3);border-radius:16px;padding:28px;text-align:center}
.sign-title{font-size:18px;font-weight:800;margin-bottom:6px}
.sign-sub{font-size:12px;color:rgba(255,255,255,.5);margin-bottom:24px;line-height:1.5}
.sign-input{width:100%;background:#0a0a0a;border:1px solid rgba(255,255,255,.15);border-radius:10px;padding:14px 16px;font-size:14px;color:#fff;font-family:inherit;margin-bottom:12px;outline:none;transition:.2s}
.sign-input:focus{border-color:#F5B544}
.sign-input::placeholder{color:rgba(255,255,255,.3)}
.btn-sign{width:100%;background:linear-gradient(135deg,#F5B544,#e09400);color:#000;font-weight:800;font-size:16px;border:none;border-radius:12px;padding:16px;cursor:pointer;font-family:inherit;transition:.15s;letter-spacing:.3px}
.btn-sign:hover{transform:translateY(-1px);box-shadow:0 8px 24px rgba(245,181,68,.3)}
.btn-sign:disabled{opacity:.6;cursor:not-allowed;transform:none}
.success-box{text-align:center;padding:40px 20px}
.success-icon{width:72px;height:72px;background:rgba(34,197,94,.15);border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 20px}
.success-title{font-size:22px;font-weight:800;margin-bottom:8px;color:#22c55e}
.success-sub{font-size:14px;color:rgba(255,255,255,.5);line-height:1.6}
.footer{text-align:center;margin-top:40px;font-size:11px;color:rgba(255,255,255,.2)}
.footer a{color:rgba(245,181,68,.7);text-decoration:none}
.status-aprovado{display:none;background:rgba(34,197,94,.12);border:1px solid rgba(34,197,94,.3);border-radius:10px;padding:12px 16px;font-size:13px;color:#22c55e;font-weight:600;text-align:center;margin-bottom:20px}
.loading{text-align:center;padding:60px 20px}
.spinner{width:40px;height:40px;border:3px solid rgba(245,181,68,.2);border-top-color:#F5B544;border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 16px}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-text{font-size:13px;color:rgba(255,255,255,.4)}
@media(max-width:560px){.info-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
  <div class="logo-area">
    <div class="logo-text">Digital Coffee</div>
    <div style="font-size:11px;color:rgba(255,255,255,.3);margin-top:4px">Agência de Marketing Digital</div>
  </div>

  <div id="main-content">
    <div class="loading">
      <div class="spinner"></div>
      <div class="loading-text">Carregando orçamento...</div>
    </div>
  </div>

  <div class="footer">
    Powered by <a href="https://digitalcoffeehub.netlify.app">Digital Coffee Hub</a> · Pirapora, MG
  </div>
</div>

<script>
const WEBHOOK_BUSCAR = 'https://luna.adigitalcoffee.com/webhook/hub-orc-public';
const WEBHOOK_APROVAR = 'https://luna.adigitalcoffee.com/webhook/hub-orc-aprovar';

// Pega o ID do orçamento da URL
function getOrcId() {
  const path = window.location.pathname;
  const parts = path.split('/').filter(Boolean);
  // /aprovacao/ORC-xxx → pega o último segmento
  for (let i = parts.length - 1; i >= 0; i--) {
    if (parts[i] && parts[i] !== 'aprovacao') return parts[i];
  }
  // Fallback: query string
  const params = new URLSearchParams(window.location.search);
  return params.get('id') || params.get('orc');
}

function fmtMoeda(v) {
  return 'R$ ' + Number(v||0).toLocaleString('pt-BR', {minimumFractionDigits: 2});
}

function renderOrcamento(d) {
  const jaAprovado = d.status === 'aprovado';
  const itensTr = (d.itens || []).map(it =>
    `<tr><td>${it.desc||it.nome||'Serviço'}</td><td style="text-align:right">${it.qtd||1}x</td><td>${fmtMoeda(it.valor||0)}</td></tr>`
  ).join('');

  const html = `
    <div class="card">
      <div class="badge-num">${d.numero || d.id || 'ORC'}</div>
      ${jaAprovado ? '<div class="status-aprovado" style="display:block">✓ Este orçamento já foi aprovado</div>' : ''}
      <div class="orc-title">${d.titulo || 'Proposta Comercial'}</div>
      <div class="orc-sub">Proposta preparada exclusivamente para você</div>
      <div class="info-grid">
        <div class="info-item"><label>Cliente</label><span>${d.cliente||'—'}</span></div>
        <div class="info-item"><label>Data</label><span>${d.data||'—'}</span></div>
        <div class="info-item"><label>Validade</label><span>${d.validade||'30 dias'}</span></div>
        <div class="info-item"><label>Responsável</label><span>${d.responsavel||'Digital Coffee'}</span></div>
      </div>
      <div class="divider"></div>
      ${itensTr ? `
      <table class="items-table">
        <thead><tr><th>Serviço / Item</th><th style="text-align:right">Qtd</th><th style="text-align:right">Valor</th></tr></thead>
        <tbody>${itensTr}</tbody>
      </table>` : ''}
      <div class="total-row">
        <div class="total-label">Valor Total</div>
        <div class="total-value">${fmtMoeda(d.valor||d.total||0)}</div>
      </div>
      ${d.observacoes ? `<div class="divider"></div><div class="obs-box">${d.observacoes}</div>` : ''}
    </div>

    ${jaAprovado ? `
    <div class="sign-card">
      <div class="success-box">
        <div class="success-icon"><svg viewBox="0 0 24 24" style="width:32px;height:32px;fill:#22c55e"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg></div>
        <div class="success-title">Orçamento Aprovado!</div>
        <div class="success-sub">Este orçamento foi aprovado e assinado.<br>Em breve nossa equipe entrará em contato.</div>
      </div>
    </div>` : `
    <div class="sign-card">
      <div class="sign-title">Aprovar e Assinar Proposta</div>
      <div class="sign-sub">Ao assinar você confirma que leu e concordou com<br>as condições e valores apresentados acima.</div>
      <input class="sign-input" id="sign-name" placeholder="Digite seu nome completo para assinar" maxlength="100">
      <input class="sign-input" id="sign-cpf" placeholder="CPF (opcional)" maxlength="20" style="margin-top:0;margin-bottom:16px">
      <button class="btn-sign" id="btn-aprovar" onclick="aprovar('${d.id||d.numero||''}')">
        ✓ Aprovar e Assinar Proposta
      </button>
    </div>`}
  `;

  document.getElementById('main-content').innerHTML = html;
}

function renderErro(msg) {
  document.getElementById('main-content').innerHTML = `
    <div class="card" style="text-align:center;padding:48px 24px">
      <div style="font-size:40px;margin-bottom:16px">🔍</div>
      <div style="font-size:18px;font-weight:700;margin-bottom:8px">Orçamento não encontrado</div>
      <div style="font-size:13px;color:rgba(255,255,255,.4)">${msg||'O link pode ter expirado ou é inválido.'}</div>
    </div>`;
}

async function carregarOrcamento() {
  const id = getOrcId();
  if (!id) { renderErro('ID do orçamento não informado.'); return; }
  try {
    const r = await fetch(WEBHOOK_BUSCAR + '?id=' + encodeURIComponent(id));
    const d = await r.json();
    if (d && (d.id || d.numero || d.titulo)) {
      renderOrcamento(d);
    } else {
      renderErro('Orçamento não encontrado. Verifique o link com a agência.');
    }
  } catch(e) {
    // Fallback: tentar localStorage (para testes locais)
    try {
      const stored = localStorage.getItem('orc_' + id);
      if (stored) { renderOrcamento(JSON.parse(stored)); return; }
    } catch {}
    renderErro('Erro ao carregar orçamento. Tente novamente.');
  }
}

async function aprovar(orcId) {
  const nome = document.getElementById('sign-name')?.value.trim();
  const cpf = document.getElementById('sign-cpf')?.value.trim();
  if (!nome || nome.length < 3) {
    document.getElementById('sign-name').style.borderColor = '#ef4444';
    document.getElementById('sign-name').focus();
    return;
  }
  const btn = document.getElementById('btn-aprovar');
  btn.disabled = true;
  btn.textContent = 'Processando...';
  try {
    await fetch(WEBHOOK_APROVAR + '?id=' + encodeURIComponent(orcId) + '&nome=' + encodeURIComponent(nome) + '&cpf=' + encodeURIComponent(cpf||''));
  } catch {}
  // Sempre mostrar sucesso para o cliente
  document.getElementById('main-content').innerHTML = `
    <div class="card">
      <div class="success-box">
        <div class="success-icon"><svg viewBox="0 0 24 24" style="width:32px;height:32px;fill:#22c55e"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg></div>
        <div class="success-title">Proposta Aprovada!</div>
        <div class="success-sub">
          Obrigado, <strong>${nome}</strong>!<br><br>
          Sua aprovação foi registrada com sucesso.<br>
          Nossa equipe entrará em contato em breve para dar continuidade ao projeto.
        </div>
      </div>
    </div>`;
}

carregarOrcamento();
</script>
</body>
</html>
